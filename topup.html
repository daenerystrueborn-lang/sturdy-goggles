<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astral of the Sun — Top-up</title>
  <meta name="description" content="Astral of the Sun — top up Solars and Gems, buy Premium, server offers.">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="topup">

  <canvas id="c" aria-hidden="true"></canvas>

  <main class="page">

    <header class="page-head">
      <h1 class="page-title" data-page-title>Top-up</h1>
      <div class="page-sub">Solars &amp; Gems top-up · Premium · Server offers</div>
    </header>

    <!-- currency top-up -->
    <section class="topup-card">
      <div class="section-head">
        <h2 class="section-title">Top up currency</h2>
        <div class="section-meta">Solars &amp; Gems</div>
      </div>

      <div class="shop-filter" id="curTabs" role="tablist">
        <button class="chip active" type="button" data-cur="solars">Solars</button>
        <button class="chip" type="button" data-cur="gems">Gems</button>
      </div>

      <div class="topup-amount-row">
        <input class="topup-input" id="topupAmount" type="number" min="1" step="1" inputmode="numeric"
               placeholder="Amount" aria-label="Amount to top up">
        <button class="btn btn-primary" id="createTopup" type="button">Create top-up</button>
      </div>
      <div class="topup-flash" id="topupFlash" role="status"></div>

      <div class="pkg-grid" id="pkgGrid"></div>
    </section>

    <!-- premium -->
    <section class="topup-card">
      <div class="section-head">
        <h2 class="section-title">Premium</h2>
        <div class="section-meta">Battle pass Premium</div>
      </div>
      <div class="pkg-grid" id="premiumGrid"></div>
      <div class="topup-amount-row">
        <button class="btn btn-dark btn-full" id="buyPremium" type="button">Buy Premium</button>
      </div>
    </section>

    <!-- server offers -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Server Offers</h2>
        <div class="section-meta"><span data-bind="counts.offers" data-empty="0"></span> offers</div>
      </div>
      <div class="pkg-grid" id="offersGrid"></div>
    </section>

    <!-- purchase requests / process -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Your requests</h2>
        <div class="section-meta" id="reqMeta">0 requests</div>
      </div>
      <div class="req-list" id="reqList"></div>
      <div class="hint-note">Requests are handed to your backend via <code>Astral.topup.onRequest</code>. Nothing is charged on this device.</div>
    </section>

  </main>

  <!-- bottom nav -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
    <div class="bottom-nav-inner">
      <div class="nav-pill" id="navPill"></div>

      <button class="nav-tab" data-page="home" data-href="index.html" type="button" aria-label="Home">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8.5Z" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="season" data-href="season.html" type="button" aria-label="Season">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M4.5 6.5c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 12c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 17.5c3 2 5 2 7.5 0s4.5-2 7.5 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="shop" data-href="shop.html" type="button" aria-label="Shop">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="profile" data-href="profile.html" type="button" aria-label="Profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke-linecap="round"/></svg>
        </span>
      </button>
    </div>
  </nav>

  <script src="js/navigator.js" defer></script>
  <script src="js/topup.js" defer></script>
</body>
</html>
