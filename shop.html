<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astral of the Sun — Shop</title>
  <meta name="description" content="Astral of the Sun — item shop.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="shop">

  <canvas id="c" aria-hidden="true"></canvas>

  <main class="page">

    <header class="page-head">
      <h1 class="page-title" data-page-title>Shop</h1>
      <div class="page-sub">Item shop</div>
    </header>

    <!-- total currency -->
    <div class="currency-bar">
      <span class="label">Total</span>
      <div class="balance" id="walletBalance">
        <span data-bind="wallet.solars" data-empty="0"></span>
        <svg class="coin" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="12" r="9" fill="#f5c44a"/>
          <circle cx="12" cy="12" r="6.4" fill="#e6a90d"/>
          <text x="12" y="16.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5200">$</text>
        </svg>
      </div>
      <div class="balance" id="gemsBalance">
        <span data-bind="wallet.gems" data-empty="0"></span>
        <svg class="gem" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 3h12l4 6-10 12L2 9l4-6Z" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
          <path d="M2 9h20M9 3 7 9l5 12M15 3l2 6-5 12" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <!-- search + filters -->
    <div class="shop-toolbar">
      <input class="shop-search" id="shopSearch" type="search" placeholder="Search items…" aria-label="Search items">
    </div>
    <div class="shop-filter" id="shopFilters" role="tablist">
      <button class="chip active" type="button" data-cat="">All</button>
      <button class="chip" type="button" data-cat="weapons">Weapons</button>
      <button class="chip" type="button" data-cat="gear">Gear</button>
      <button class="chip" type="button" data-cat="items">Items</button>
      <button class="chip" type="button" data-cat="pokemon">Pokémon</button>
    </div>

    <!-- items -->
    <section class="section">
      <div class="section-head">
        <h2 class="section-title">Items</h2>
        <div class="section-meta"><span data-bind="counts.shop" data-empty="0"></span> items</div>
      </div>
      <div class="shop-page-grid" id="shopGrid"></div>
    </section>

  </main>

  <!-- bottom nav -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
    <div class="bottom-nav-inner">
      <div class="nav-pill" id="navPill"></div>

      <button class="nav-tab" data-page="home" data-href="index.html" type="button" aria-label="Home">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8.5Z" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="season" data-href="season.html" type="button" aria-label="Season">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M4.5 6.5c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 12c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 17.5c3 2 5 2 7.5 0s4.5-2 7.5 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="shop" data-href="shop.html" type="button" aria-label="Shop">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-page="profile" data-href="profile.html" type="button" aria-label="Profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke-linecap="round"/></svg>
        </span>
      </button>
    </div>
  </nav>

  <script src="js/navigator.js" defer></script>
  <script src="js/shop.js" defer></script>
</body>
</html>
