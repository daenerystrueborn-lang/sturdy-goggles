name: Build Artifact

on:
  push:
    branches:
      - main
      - "arena/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    name: Build static app
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate app
        run: |
          python3 - <<'PY'
          import json, glob, sys
          from html.parser import HTMLParser

          class Checker(HTMLParser):
              VOID = {"area","base","br","col","embed","hr","img","input","link","meta","param","source","track","wbr"}
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.errors = []
              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID:
                      self.stack.append((tag, self.getpos()))
              def handle_endtag(self, tag):
                  if tag in self.VOID:
                      return
                  if not self.stack:
                      self.errors.append(f"Unexpected </{tag}> at {self.getpos()}")
                      return
                  names = [t for t, _ in self.stack]
                  if tag not in names:
                      self.errors.append(f"Stray </{tag}> at {self.getpos()}")
                      return
                  while self.stack and self.stack[-1][0] != tag:
                      t, pos = self.stack.pop()
                      self.errors.append(f"Unclosed <{t}> opened at {pos}")
                  if self.stack:
                      self.stack.pop()

          files = glob.glob("index.html") + glob.glob("**/*.html", recursive=True)
          failed = False
          for f in sorted(set(files)):
              c = Checker()
              c.feed(open(f, encoding="utf-8").read())
              for t, pos in c.stack:
                  c.errors.append(f"Unclosed <{t}> opened at {pos}")
              if c.errors:
                  failed = True
                  print(f"INVALID  {f}")
                  for e in c.errors:
                      print("   -", e)
              else:
                  print(f"OK       {f}")
          sys.exit(1 if failed else 0)
          PY

      - name: Package app
        run: |
          mkdir -p dist/astral-of-the-sun
          cp -r index.html css js assets dist/astral-of-the-sun/ 2>/dev/null || true
          echo "Artifact prepared: astral-of-the-sun/"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: astral-of-the-sun
          path: dist/astral-of-the-sun/
          if-no-files-found: error
