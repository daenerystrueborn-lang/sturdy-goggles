<!DOCTYPE html>
<html lang="en" class="no-js">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Astral of the Sun</title>
  <meta name="description" content="Astral of the Sun — a data-driven companion home screen.">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <canvas id="c" aria-hidden="true"></canvas>

  <main>
    <div class="header">

      <!-- profile -->
      <div class="profile-card">
        <div class="avatar-cube" id="avatarCube"></div>
        <div class="profile-text">
          <div class="profile-name" data-bind="player.name" data-empty="Player"></div>
          <div class="profile-sub" data-bind="player.sub" data-empty="—"></div>
        </div>

        <div class="netstat-container">
          <div class="netstat-ring signal-high" id="netstatRing">
            <div class="icon">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M12 20a1.6 1.6 0 1 0 0-3.2 1.6 1.6 0 0 0 0 3.2Z"/>
                <path d="M8.3 13.7a5.3 5.3 0 0 1 7.4 0l-1.4 1.4a3.3 3.3 0 0 0-4.6 0l-1.4-1.4Z"/>
                <path d="M5 10.4a9.3 9.3 0 0 1 14 0l-1.4 1.5a7.3 7.3 0 0 0-11.2 0L5 10.4Z"/>
                <path d="M1.8 7.1a13.4 13.4 0 0 1 20.4 0l-1.4 1.5a11.4 11.4 0 0 0-17.6 0L1.8 7.1Z"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="notif-wrap">
          <button class="notif-btn" id="notifBtn" type="button" aria-label="Notifications" aria-expanded="false">
            <span class="notif-dot" id="notifDot" hidden></span>
            <svg width="17" height="17" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M9 1.5C6.51 1.5 4.5 3.51 4.5 6V10.5L3 12.5H15L13.5 10.5V6C13.5 3.51 11.49 1.5 9 1.5Z" stroke="rgba(255,255,255,0.45)" stroke-width="1.3" fill="none"/>
              <path d="M7.5 12.5a1.5 1.5 0 003 0" stroke="rgba(255,255,255,0.45)" stroke-width="1.3" fill="none" stroke-linecap="round"/>
            </svg>
          </button>
          <div class="notif-dropdown" id="notifDropdown">
            <div class="notif-empty">No new notifications</div>
          </div>
        </div>
      </div>

      <!-- stats: level / solars / gems -->
      <div class="stats-row">

        <div class="stat-card stat-level">
          <div class="stat-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z" fill="#ffffff"/>
            </svg>
          </div>
          <div class="stat-text">
            <div class="stat-label">Level</div>
            <div class="stat-value" data-bind="stats.level" data-empty="—"></div>
          </div>
        </div>

        <div class="stat-card stat-solars">
          <div class="stat-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="12" r="8" fill="none" stroke="#ffffff" stroke-width="1.6"/>
              <path d="M9.6 14.4c0 1.05.98 1.7 2.4 1.7 1.5 0 2.4-.62 2.4-1.55 0-.98-.75-1.3-2.4-1.65-1.62-.35-2.4-.72-2.4-1.7 0-.9.9-1.55 2.4-1.55 1.42 0 2.4.65 2.4 1.7" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="12" y1="7.3" x2="12" y2="8.7" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
              <line x1="12" y1="15.3" x2="12" y2="16.7" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
          </div>
          <div class="stat-text">
            <div class="stat-label">Solars</div>
            <div class="stat-value">
              <svg class="coin" viewBox="0 0 24 24" aria-hidden="true">
                <circle cx="12" cy="12" r="9" fill="#f5c44a"/>
                <circle cx="12" cy="12" r="6.4" fill="#e6a90d"/>
                <text x="12" y="16.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5200">$</text>
              </svg>
              <span data-bind="stats.solars" data-empty="0"></span>
            </div>
          </div>
        </div>

        <div class="stat-card stat-gems">
          <div class="stat-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 3h12l4 6-10 12L2 9l4-6Z" fill="rgba(255,255,255,0.12)" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round"/>
              <path d="M2 9h20M9 3 7 9l5 12M15 3l2 6-5 12" stroke="rgba(255,255,255,0.4)" stroke-width="1" stroke-linejoin="round"/>
            </svg>
          </div>
          <div class="stat-text">
            <div class="stat-label">Gems</div>
            <div class="stat-value" data-bind="stats.gems" data-empty="0"></div>
          </div>
        </div>

      </div>

      <!-- hero / main banner -->
      <div class="main-box" id="mainBox"></div>

    </div>

    <div class="content">

      <!-- quick actions -->
      <div class="quick-actions">
        <div class="quick-action">
          <div class="qa-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M6 8h12l-1 12H7L6 8Z" stroke="rgba(255,255,255,0.75)" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M9 8V6a3 3 0 0 1 6 0v2" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="qa-label">Shop</div>
        </div>
        <div class="quick-action">
          <div class="qa-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <circle cx="12" cy="15" r="4" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
              <circle cx="6" cy="9" r="2" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
              <circle cx="18" cy="9" r="2" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
              <circle cx="9" cy="5.5" r="1.6" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
              <circle cx="15" cy="5.5" r="1.6" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="qa-label">Pokémon</div>
        </div>
        <div class="quick-action">
          <div class="qa-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M4 21V9l3-3 2 2 3-3 3 3 2-2 3 3v12H4Z" stroke="rgba(255,255,255,0.75)" stroke-width="1.6" stroke-linejoin="round"/>
              <path d="M10 21v-5h4v5" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
            </svg>
          </div>
          <div class="qa-label">Dungeons</div>
        </div>
      </div>

      <!-- shop -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Shop</h2>
          <div class="section-meta"><span data-bind="counts.shop" data-empty="0"></span> items</div>
        </div>
        <div class="shop-grid" id="shopGrid" data-template="shopCard"></div>
      </section>

      <!-- pokemon roster -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Pokémon Roster</h2>
          <div class="section-meta"><span data-bind="counts.roster" data-empty="0"></span> ready</div>
        </div>
        <div class="roster-scroll" id="rosterScroll" data-template="rosterCard"></div>
      </section>

      <!-- dungeons -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Dungeons &amp; Runs</h2>
          <div class="section-meta"><span data-bind="counts.dungeons" data-empty="0"></span> available</div>
        </div>
        <div class="dungeon-list" id="dungeonList" data-template="dungeonRow"></div>
      </section>

      <!-- friends -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Friends</h2>
          <div class="section-meta"><span data-bind="counts.friends" data-empty="0"></span></div>
        </div>
        <div class="friends-row" id="friendsRow" data-template="friendRow"></div>
      </section>

      <!-- top-up -->
      <section class="section">
        <div class="section-head">
          <h2 class="section-title">Top-up</h2>
          <div class="section-meta">Add currency</div>
        </div>
        <div class="topup-row">
          <button class="btn btn-outline" type="button">Add currency</button>
          <button class="btn btn-primary" type="button">Top-up</button>
        </div>
      </section>

    </div>
  </main>

  <!-- bottom nav -->
  <nav class="bottom-nav" id="bottomNav" aria-label="Primary">
    <div class="bottom-nav-inner">
      <div class="nav-pill" id="navPill"></div>

      <button class="nav-tab active" data-tab="home" type="button" aria-label="Home">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M4 11.5 12 4l8 7.5V20a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1v-8.5Z" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-tab="season" type="button" aria-label="Season">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2v20M4.5 6.5c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 12c3 2 5 2 7.5 0s4.5-2 7.5 0M4.5 17.5c3 2 5 2 7.5 0s4.5-2 7.5 0" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-tab="shop" type="button" aria-label="Shop">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><path d="M6 8h12l-1 12H7L6 8Z" stroke-linejoin="round"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
        </span>
      </button>

      <button class="nav-tab" data-tab="profile" type="button" aria-label="Profile">
        <span class="nav-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke-linecap="round"/></svg>
        </span>
      </button>
    </div>
  </nav>

  <!-- templates (empty data; populated at runtime from the data layer) -->
  <template id="tpl-shopCard">
    <div class="shop-card">
      <div class="shop-icon"></div>
      <div class="shop-name" data-bind="name" data-empty="Item"></div>
      <div class="shop-desc" data-bind="desc" data-empty="—"></div>
      <div class="shop-foot">
        <div class="shop-price">
          <svg class="coin" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9" fill="#f5c44a"/>
            <circle cx="12" cy="12" r="6.4" fill="#e6a90d"/>
            <text x="12" y="16.2" text-anchor="middle" font-size="12" font-weight="700" fill="#7a5200">$</text>
          </svg>
          <span data-bind="price" data-empty="0"></span>
        </div>
        <button class="btn btn-primary" type="button">Buy</button>
      </div>
    </div>
  </template>

  <template id="tpl-rosterCard">
    <div class="roster-card">
      <div class="roster-avatar"></div>
      <div class="roster-name" data-bind="name" data-empty="—"></div>
      <div class="roster-meta" data-bind="meta" data-empty="—"></div>
      <div class="roster-cp"><span data-bind="cp" data-empty="0"></span></div>
      <button class="btn btn-dark btn-full" type="button">Battle</button>
    </div>
  </template>

  <template id="tpl-dungeonRow">
    <div class="dungeon-row">
      <div class="row-text">
        <div class="row-title" data-bind="name" data-empty="Run"></div>
        <div class="row-sub" data-bind="sub" data-empty="—"></div>
      </div>
      <span class="diff-badge" data-bind="diff" data-empty="—"></span>
      <button class="btn btn-dark" type="button">Enter</button>
    </div>
  </template>

  <template id="tpl-friendRow">
    <div class="friend-avatars">
      <div class="friend-avatar" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="8" r="3.4" stroke="rgba(255,255,255,0.75)" stroke-width="1.6"/>
          <path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="rgba(255,255,255,0.75)" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </div>
    </div>
    <button class="btn btn-primary" type="button">View</button>
  </template>

  <script src="js/app.js" defer></script>
</body>
</html>
